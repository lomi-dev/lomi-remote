name: Release Lomi Remote

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag matching Cargo.toml (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lomi-remote-release-publication
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      revision: ${{ steps.tag.outputs.revision }}
      platforms: ${{ steps.tag.outputs.platforms }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate stable tag and public update root
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          MACOS_ENABLED: ${{ vars.LOMI_MACOS_RELEASE_ENABLED }}
          WINDOWS_ENABLED: ${{ vars.LOMI_WINDOWS_RELEASE_ENABLED }}
        run: |
          python3 release/ci_build.py --tag "$RELEASE_TAG" --check
          python3 - <<'PY'
          import os, subprocess
          platforms = ['linux-x86_64', 'linux-aarch64']
          if os.environ.get('MACOS_ENABLED') == 'true':
              platforms += ['macos-x86_64', 'macos-aarch64']
          if os.environ.get('WINDOWS_ENABLED') == 'true':
              platforms += ['windows-x86_64', 'windows-aarch64']
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + os.environ['RELEASE_TAG'] + '\n')
              output.write('revision=' + revision + '\n')
              output.write('platforms=' + ','.join(platforms) + '\n')
          PY
      - name: Check tag tooling and release signatures
        run: python3 -m unittest discover -s release -p 'test_*.py'
      - name: Check release gateway and installer rendering
        run: node --test release/gateway/worker.test.mjs release/bootstrap/render.test.mjs

  linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev clang cmake
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build authenticated Linux bundle
        env:
          LOMI_LINUX_BOOTSTRAP_KEY: ${{ secrets.LOMI_LINUX_BOOTSTRAP_KEY }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python3 release/ci_build.py --tag "$RELEASE_TAG" --platform "$RELEASE_PLATFORM" --output "$RUNNER_TEMP/bundle-output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/bundle-output/
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: validate
    if: vars.LOMI_MACOS_RELEASE_ENABLED == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [macos-aarch64, macos-x86_64]
    # This runner uses the already provisioned Developer ID and Keychain
    # profile. Public PRs never execute this workflow or use this runner.
    runs-on: [self-hosted, lomi-release, macOS]
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      LOMI_MACOS_SIGNING_IDENTITY: ${{ vars.LOMI_MACOS_SIGNING_IDENTITY }}
      LOMI_MACOS_TEAM_ID: ${{ vars.LOMI_MACOS_TEAM_ID }}
      LOMI_MACOS_NOTARY_PROFILE: ${{ vars.LOMI_MACOS_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - name: Verify Developer ID and notarization access
        run: python3 release/macos_signing.py check
      - name: Build, sign and notarize macOS bundle
        env:
          CARGO_TARGET_DIR: ${{ runner.tool_cache }}/lomi-remote-target
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python3 release/ci_build.py --tag "$RELEASE_TAG" --platform "$RELEASE_PLATFORM" --output "$RUNNER_TEMP/bundle-output"
      - name: Keep notarization diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notarization-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bundle-output/*.notarization.json
            ${{ runner.temp }}/bundle-output/*.notarization-log.json
            ${{ runner.temp }}/bundle-output/*.notarization.pending
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/bundle-output/
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: validate
    if: vars.LOMI_WINDOWS_RELEASE_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-x86_64, windows-aarch64]
    # Enable only after a native Windows runner has its Authenticode key.
    runs-on: [self-hosted, lomi-release, '${{ matrix.platform }}']
    env:
      LOMI_WINDOWS_SIGNER_THUMBPRINT: ${{ vars.LOMI_WINDOWS_SIGNER_THUMBPRINT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and Authenticode-sign paired Windows executables
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python3 release/ci_build.py --tag "$RELEASE_TAG" --platform "$RELEASE_PLATFORM" --output "$RUNNER_TEMP/bundle-output"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/bundle-output/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, linux, macos, windows]
    if: >-
      always() && needs.validate.result == 'success' && needs.linux.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/bundles
      - name: Verify all bundles and sign release metadata
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
          REQUIRED_PLATFORMS: ${{ needs.validate.outputs.platforms }}
          LOMI_TUF_TARGETS_KEY: ${{ secrets.LOMI_TUF_TARGETS_KEY }}
          LOMI_TUF_SNAPSHOT_KEY: ${{ secrets.LOMI_TUF_SNAPSHOT_KEY }}
          LOMI_TUF_TIMESTAMP_KEY: ${{ secrets.LOMI_TUF_TIMESTAMP_KEY }}
          LOMI_RELEASE_INDEX_KEY: ${{ secrets.LOMI_RELEASE_INDEX_KEY }}
        run: python3 release/ci_publish.py assemble --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --platforms "$REQUIRED_PLATFORMS" --bundles "$RUNNER_TEMP/bundles" --output "$RUNNER_TEMP/publication"
      - name: Publish the complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python3 release/publish_release.py upload --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/publication"
