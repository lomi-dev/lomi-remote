[workspace]
members = ["crates/*"]
exclude = ["vendor/alacritty_terminal", "vendor/vte", "crates/lomi-remote-crypto/vendor/snow"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.1.0"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Test-time cost control: unoptimized code dominates real TLS/Noise terminal
# tests (per-fragment signature verification, hex/JSON validation). Light
# optimization keeps assertions, overflow checks and debuginfo intact.
[profile.dev]
opt-level = 1

[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
vte = { path = "vendor/vte" }
