[package]
name = "lomi-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sha2 = "=0.10.9"
uuid = { version = "=1.26.1", features = ["v4"] }
serde = { version = "=1.0.229", features = ["derive"] }
lomi-fs-policy = { path = "../lomi-fs-policy" }
lomi-remote-protocol = { path = "../lomi-remote-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Pipes", "Win32_System_Threading", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }
