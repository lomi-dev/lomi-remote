[package]
name = "lomi-remote-protocol"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["rlib"]

[features]
browser = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.2"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
wasm-bindgen = { version = "=0.2.126", optional = true }
