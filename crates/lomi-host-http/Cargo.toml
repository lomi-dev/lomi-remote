[package]
name = "lomi-host-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lomi-host-auth = { path = "../lomi-host-auth" }
lomi-remote-protocol = { path = "../lomi-remote-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
zeroize = "=1.8.2"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "ring"] }

socket2 = "=0.6.3"
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
webpki-roots = "=1.0.9"
# Same product policy as lomi-terminal-state; frames/upgrade requests must never
# reach a logger, including standalone host-http builds and debug profiles.
log = { version = "=0.4.34", features = ["max_level_off", "release_max_level_off"] }
