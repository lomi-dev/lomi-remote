[package]
name = "lomi-windows-service-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[features]
fixture-test-hooks = []

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
lomi-terminal-state = { path = "../lomi-terminal-state" }
windows-service = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_RemoteDesktop"] }
