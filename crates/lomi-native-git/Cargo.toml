[package]
name = "lomi-native-git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lomi-native-project-files = { path = "../lomi-native-project-files" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
