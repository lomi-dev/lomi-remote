[package]
name = "lomi-chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "lomi_chat"

[dependencies]
base64 = "0.22.1"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
ring = { version = "0.17.14" }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["time", "sync", "macros", "process", "io-util", "fs", "net", "rt"] }
tempfile = "3"
toml_edit = "0.25"
zeroize = { version = "=1.8.2", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
