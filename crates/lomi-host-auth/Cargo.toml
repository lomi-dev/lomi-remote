[package]
name = "lomi-host-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
fixture-support = []

[dependencies]
lomi-platform = { path = "../lomi-platform" }
lomi-remote-crypto = { path = "../lomi-remote-crypto" }
lomi-remote-protocol = { path = "../lomi-remote-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["v4"] }
zeroize = "=1.8.2"
