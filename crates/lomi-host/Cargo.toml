[package]
name = "lomi-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []

[dependencies]
lomi-platform = { path = "../lomi-platform" }
lomi-host-store = { path = "../lomi-host-store" }
lomi-host-auth = { path = "../lomi-host-auth" }
lomi-host-http = { path = "../lomi-host-http" }
lomi-terminal = { path = "../lomi-terminal" }
lomi-remote-protocol = { path = "../lomi-remote-protocol" }
lomi-remote-crypto = { path = "../lomi-remote-crypto" }
lomi-files = { path = "../lomi-files" }
lomi-native-files = { path = "../lomi-native-files" }
lomi-native-project-files = { path = "../lomi-native-project-files" }
lomi-native-git = { path = "../lomi-native-git" }
lomi-native-custody = { path = "../lomi-native-custody" }
lomi-git = { path = "../lomi-git" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
signal-hook = "=0.4.5"
uuid = { version = "=1.26.1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Console"] }
