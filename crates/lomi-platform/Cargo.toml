[package]
name = "lomi-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse", "display"] }
lomi-remote-protocol = { path = "../lomi-remote-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["v4"] }
tempfile = "=3.27.0"
zeroize = "=1.8.2"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"
socket2 = "=0.6.3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
chacha20poly1305 = "=0.10.1"
core-foundation = "=0.10.1"
getrandom = "=0.4.3"
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_15"] }
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
lomi-files = { path = "../lomi-files" }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_TaskScheduler"] }
windows-service = "=0.8.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_Shell"] }
sha2 = "=0.10.9"
