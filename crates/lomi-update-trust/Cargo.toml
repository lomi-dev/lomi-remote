[package]
name = "lomi-update-trust"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[features]
release-root = []
local-release-test = ["release-root"]

[dependencies]
async-trait = "=0.1.92"
bytes = "=1.12.1"
futures-util = "=0.3.32"
jiff = "=0.2.22"
libc = "=0.2.189"
lomi-remote-protocol = { path = "../lomi-remote-protocol" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread"] }
tough = { version = "=0.24.0", default-features = false }
url = "=2.5.8"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
lomi-platform = { path = "../lomi-platform" }

[build-dependencies]
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com"] }
