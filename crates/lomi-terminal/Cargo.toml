[package]
name = "lomi-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
experimental-macos-session-cleanup = []
experimental-macos-coalition-cleanup = []

[dependencies]
lomi-remote-protocol = { path = "../lomi-remote-protocol" }
lomi-terminal-state = { path = "../lomi-terminal-state" }
portable-pty = "=0.9.0"
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["v4"] }
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
lomi-platform = { path = "../lomi-platform" }

[target.'cfg(windows)'.dependencies]
lomi-windows-pty = { path = "../lomi-windows-pty" }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices"] }
