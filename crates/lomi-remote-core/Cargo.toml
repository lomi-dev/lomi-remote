[package]
name = "lomi-remote-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
# rlib: desktop (Tauri); staticlib: iOS/Android; cdylib: wasm32 via the `browser` feature.
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
browser = ["dep:wasm-bindgen"]

[dependencies]
# preserve_order: nested args/data keep insertion order so canonical vectors re-encode byte for byte.
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "preserve_order"] }
wasm-bindgen = { version = "=0.2.126", optional = true }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
zeroize = "=1.8.2"

[dev-dependencies]
sha2 = "=0.10.9"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
