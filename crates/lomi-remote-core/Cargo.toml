[package]
name = "lomi-remote-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
# rlib: desktop (Tauri); staticlib: iOS/Android; cdylib: wasm32 via the `browser` feature.
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
browser = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "=0.2.126", optional = true }
